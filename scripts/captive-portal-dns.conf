# Configuração do dnsmasq para captive portal do DJ Haules.
# Instalar em: /etc/NetworkManager/dnsmasq-shared.d/djhaules-captive.conf
#
# Faz com que TODOS os domínios resolvam para o IP do hotspot (192.168.4.1)
# enquanto o hotspot estiver ativo. Isso faz o celular detectar que está em
# uma rede com portal e abrir a página de configuração automaticamente.

address=/#/192.168.4.1
